<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>下载wBox for esp32</title>
</head>
<body><h1>

wBox:
随时随地玩游戏</h1>   <h3>下载wBox的esp32(OLED SSD1306)版本</h3>
    <hr>
    <div id="fileList">加载文件中...</div>
    <hr>
    <button onclick="loadFiles()">刷新文件</button>
    
    <h5>注意：带pat的只是更新的游戏文件，不带启动器本体以及ssd1306的驱动</h5><h5>接线说明：ssd1306:sda=GPIO8,scl=GPIO9，按钮GPIO21</h5><h6>wBox All Copyright by zkwei123(c)</h6><script>
        const OWNER = 'zkwei123';
        const REPO = 'zkwei123.github.io';
        const PATH = 'wbox/src';

        async function loadFiles() {
            const container = document.getElementById('fileList');
            container.innerHTML = '加载文件中...';

            try {
                const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;
                const res = await fetch(url);
                
                if (!res.ok) {
                    container.innerHTML = `❌ 加载失败 (HTTP ${res.status})`;
                    return;
                }

                const data = await res.json();
                
                if (!data || data.length === 0) {
                    container.innerHTML = '目录为空';
                    return;
                }

                let html = `<p><strong>共 ${data.length} 个文件</strong>（点击文件名下载）</p><ul>`;
                data.forEach(item => {
                    // 只显示文件，跳过目录
                    if (item.type === 'dir') {
                        html += `<li>${item.name}/ (目录)</li>`;
                        return;
                    }
                    
                    const sizeKB = (item.size / 1024).toFixed(1);
                    // 点击下载：直接用 download_url
                    html += `<li><a href="${item.download_url}" download="${item.name}">${item.name}</a> (${sizeKB} KB)</li>`;
                });
                html += '</ul>';
                container.innerHTML = html;

            } catch (err) {
                container.innerHTML = `❌ 错误: ${err.message}`;
            }
        }

        window.onload = loadFiles;
    </script>

</body>
</html>
